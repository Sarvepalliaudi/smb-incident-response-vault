[package]
name = "smb-ir-vault"
version = "0.1.0"
edition = "2021"
description = "Small Business 6-Phase Incident Response Plan & SHA3-512 Forensic Evidence Locker"
license-file = "LICENSE"

[[bin]]
name = "smb-ir-vault"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["form", "http1", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
